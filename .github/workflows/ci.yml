name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential liberror-perl libjson-perl
      - name: Build and test
        run: |
          perl Makefile.PL
          make -j"$(nproc)"
          make test

